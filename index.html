<!DOCTYPE html>
<html lang="en-NZ">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Antithetical Conjunction - Payment Details</title>

    <style>
        /* PAGE / BACKGROUND */

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background-image: url("image-1024.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* BUTTON POSITION */

        .bank-container {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 240px;
            z-index: 2;
        }

        /* COPY BUTTON */

        .share-btn {
            width: 100%;
            padding: 24px;

            background: #000000;
            color: #ffffff;

            border: none;
            border-radius: 8px;

            font-size: 19px;
            font-weight: 700;
            letter-spacing: 0.2px;

            cursor: pointer;

            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.5);

            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }

        /* HOVER */

        .share-btn:hover {
            background: #333333;
        }

        /* WHEN PRESSED */

        .share-btn:active {
            transform: scale(0.97);
        }

        /* COPIED BUTTON */

        .share-btn.copied {
            background: #000000;
            color: #ffffff;
        }

        /* THANK YOU CONTAINER */

        .thank-you {
            position: absolute;
            top: 62%;
            left: 50%;

            transform: translate(-47%, -50%) scale(0.7);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 8px;
            width: 95%;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            z-index: 3;

            transition:
                opacity 0.5s ease,
                transform 0.5s ease;
        }

        /* THANK YOU TEXT */

        .thank-you-message {
            color: #000000;

            font-family: Arial, Helvetica, sans-serif;
            font-weight: 800;

            font-size: clamp(30px, 6vw, 58px);
            line-height: 0.95;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;

            transform: rotate(-3deg);
        }

        /* MONSTER IMAGE */

        .thank-you img {
            width: 1000px;
            max-width: 95vw;
            height: auto;
            display: block;

            filter: drop-shadow(
                0 10px 10px rgba(0, 0, 0, 0.2)
            );

            animation: monsterWiggle 2s ease-in-out infinite;
        }

        /* SHOW THANK YOU */

        .thank-you.show {
            opacity: 1;
            visibility: visible;

            transform: translate(-47%, -50%) scale(1);
        }

        /* MONSTER WIGGLE */

        @keyframes monsterWiggle {
            0% {
                transform: rotate(-2deg);
            }

            50% {
                transform: rotate(2deg) translateY(-5px);
            }

            100% {
                transform: rotate(-2deg);
            }
        }

        /* PHONE / SMALL SCREEN */

        @media (max-width: 600px) {
            .bank-container {
                width: 225px;
                top: 30%;
            }

            .share-btn {
                padding: 20px;
                font-size: 17px;
            }

            .thank-you {
                top: 62%;
                width: 100%;
                gap: 5px;

                transform: translate(-47%, -50%) scale(0.7);
            }

            .thank-you-message {
                font-size: 32px;
                line-height: 0.9;
            }

            .thank-you img {
                width: 1000px;
                max-width: 95vw;
            }

            .thank-you.show {
                transform: translate(-47%, -50%) scale(1);
            }
        }
    </style>
</head>

<body>

    <!-- COPY BANK DETAILS BUTTON -->

    <div class="bank-container">
        <button
            class="share-btn"
            id="copyDetailsBtn"
            onclick="copyCombinedDetails()"
        >
            Copy Bank Details
        </button>
    </div>

    <!-- THANK YOU MESSAGE AND MONSTER -->

    <div class="thank-you" id="thankYou">

        <div class="thank-you-message">
            Thanks for supporting<br>
            live music :D
        </div>

        <img
            src="image.png"
            alt="Silly monster"
        >

    </div>

    <!-- JAVASCRIPT -->

    <script>
        async function copyCombinedDetails() {
            const name = "TAI VAN DER BAR";
            const number = "38-9005-0490046-02";

            const dynamicText = `${name}\n${number}`;

            const button = document.getElementById("copyDetailsBtn");
            const thankYou = document.getElementById("thankYou");

            try {
                await navigator.clipboard.writeText(dynamicText);

                button.innerText = "Copied!";
                button.classList.add("copied");

                thankYou.classList.add("show");

                setTimeout(function() {
                    button.innerText = "Copy Bank Details";
                    button.classList.remove("copied");
                }, 2500);

            } catch (err) {
                console.error("Could not copy details:", err);

                button.innerText = "Copy Failed";

                setTimeout(function() {
                    button.innerText = "Copy Bank Details";
                }, 2500);
            }
        }
    </script>

</body>
</html>
